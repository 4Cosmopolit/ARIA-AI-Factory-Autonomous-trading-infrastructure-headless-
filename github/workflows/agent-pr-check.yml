name: AI Agent PR Check
on:
  pull_request:
    types: [opened, edited]

jobs:
  check-agent-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check for agent-assisted checkbox
        id: check
        uses: actions/github-script@v6
        with:
          script: |
            const body = context.payload.pull_request.body;
            const isAgentAssisted = body.includes('- [x] This PR was written with meaningful AI agent assistance');
            if (isAgentAssisted) {
              core.setOutput('agent_assisted', 'true');
            }
      
      - name: Label and notify
        if: steps.check.outputs.agent_assisted == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['maybe-automated']
            });
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 Этот PR отмечен как AI-ассистированный. Бот проверит его в течение 3 дней. Если автор не подтвердит своё авторство, PR будет автоматически закрыт.'
            });
