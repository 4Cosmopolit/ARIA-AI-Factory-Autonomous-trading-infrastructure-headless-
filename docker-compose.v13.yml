version: "3.8"

# ============================================================
# ARIA AI‑Factory v13.01 — Docker Compose
# Боевое развёртывание «Сингулярность»
# ============================================================

services:
  # ------------------------------------------------------------------
  # Ядро ARIA (Контур I: Cognitive Core)
  # Стратегическое мышление, R&D, управление сессиями
  # ------------------------------------------------------------------
  aria-core:
    image: 4cosmopolit/aria-core:13.01
    container_name: aria-core
    restart: unless-stopped
    ports:
      - "9090:9090"   # gRPC / HTTP API
    environment:
      - ARIA_MODE=init
      - ARIA_LOG_LEVEL=info
      - ARIA_CONFIG=/etc/aria/core.yaml
    volumes:
      - core_config:/etc/aria
      - core_data:/var/lib/aria
      - shared_models:/models:ro
    networks:
      - aria-net
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "aria-core", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["--init"]

  # ------------------------------------------------------------------
  # Память ARIA (Контур I: Memory Core)
  # Долговременная память, графы знаний, RAG
  # ------------------------------------------------------------------
  aria-memory:
    image: 4cosmopolit/aria-memory:13.01
    container_name: aria-memory
    restart: unless-stopped
    ports:
      - "9091:9091"
    environment:
      - ARIA_CORE_HOST=aria-core
      - ARIA_CORE_PORT=9090
      - LANCEDB_PATH=/var/lib/aria/lancedb
      - GREPTIMEDB_HOST=greptimedb
    volumes:
      - memory_data:/var/lib/aria
    networks:
      - aria-net
    depends_on:
      - aria-core
      - greptimedb
    healthcheck:
      test: ["CMD", "aria-memory", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------------------------------------------
  # Страж ARIA (Контур II + III: Sentinel Core)
  # Сканер аномалий, безопасность, pre‑flight gate
  # ------------------------------------------------------------------
  aria-sentinel:
    image: 4cosmopolit/aria-sentinel:13.01
    container_name: aria-sentinel
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - ARIA_CORE_HOST=aria-core
      - ARIA_CORE_PORT=9090
      - ARIA_MODE=observe
      - MICROSANDBOX_ENABLED=true
    volumes:
      - sentinel_data:/var/lib/aria
      - /var/run/docker.sock:/var/run/docker.sock   # для управления Microsandbox
    networks:
      - aria-net
    depends_on:
      - aria-core
      - aria-memory
    healthcheck:
      test: ["CMD", "aria-sentinel", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Привилегированный режим для KVM (Microsandbox)
    privileged: true

  # ------------------------------------------------------------------
  # Интерфейсный хаб ARIA (Контур IV: Interface Hub)
  # Telegram, CopilotKit, Web UI, mcp-feedback-enhanced
  # ------------------------------------------------------------------
  aria-interface:
    image: 4cosmopolit/aria-interface:13.01
    container_name: aria-interface
    restart: unless-stopped
    ports:
      - "3000:3000"   # Web UI
      - "4000:4000"   # WebSocket для mcp-feedback-enhanced
    environment:
      - ARIA_CORE_HOST=aria-core
      - ARIA_CORE_PORT=9090
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - MCP_FEEDBACK_INTERFACE=web
      - MCP_FEEDBACK_PORT=4000
    volumes:
      - interface_config:/etc/aria
    networks:
      - aria-net
    depends_on:
      - aria-core
      - aria-sentinel
    healthcheck:
      test: ["CMD", "aria-interface", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------------------------------------------
  # Локальный LLM-движок (Ollama)
  # Используется для экономных моделей (Qwen, Gemma, DeepSeek)
  # ------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - aria-net
    # Для GPU (раскомментировать при наличии)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ------------------------------------------------------------------
  # База данных временных рядов / наблюдаемость (GreptimeDB)
  # ------------------------------------------------------------------
  greptimedb:
    image: greptime/greptimedb:latest
    container_name: greptimedb
    restart: unless-stopped
    ports:
      - "4001:4001"   # HTTP API
      - "4002:4002"   # gRPC
      - "4003:4003"   # PostgreSQL wire
    volumes:
      - greptime_data:/tmp/greptimedb
    networks:
      - aria-net
    command: standalone start --http-addr 0.0.0.0:4001 --grpc-addr 0.0.0.0:4002

  # ------------------------------------------------------------------
  # Alpha Vantage MCP (фундаментальные данные, NASDAQ-лицензия)
  # ------------------------------------------------------------------
  alphavantage-mcp:
    image: ghcr.io/alphavantage/marketdata-mcp-server:latest
    container_name: alphavantage-mcp
    restart: unless-stopped
    environment:
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
    ports:
      - "8084:8080"
    networks:
      - aria-net

  # ------------------------------------------------------------------
  # Grafana MCP (наблюдаемость и дашборды)
  # ------------------------------------------------------------------
  grafana-mcp:
    image: grafana/mcp-grafana:latest
    container_name: grafana-mcp
    restart: unless-stopped
    environment:
      - GRAFANA_URL=${GRAFANA_URL}
      - GRAFANA_API_KEY=${GRAFANA_API_KEY}
    ports:
      - "8085:8080"
    networks:
      - aria-net

  # ------------------------------------------------------------------
  # Prometheus MCP (метрики Prometheus)
  # ------------------------------------------------------------------
  prometheus-mcp:
    image: prometheus-community/prometheus-mcp:latest
    container_name: prometheus-mcp
    restart: unless-stopped
    environment:
      - PROMETHEUS_URL=${PROMETHEUS_URL}
    ports:
      - "8086:8080"
    networks:
      - aria-net

  # ------------------------------------------------------------------
  # CCXT MCP Server (универсальный крипто-шлюз, 100+ бирж)
  # ------------------------------------------------------------------
  ccxt-mcp:
    image: node:18-alpine
    container_name: ccxt-mcp
    restart: unless-stopped
    working_dir: /opt/ccxt-mcp
    command: ["node", "dist/index.js"]
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET=${BINANCE_SECRET}
    volumes:
      - ./mcp-servers/ccxt:/opt/ccxt-mcp
    ports:
      - "8087:8080"
    networks:
      - aria-net

  # ------------------------------------------------------------------
  # Arkham Intel MCP (ончейн-разведка)
  # ------------------------------------------------------------------
  arkham-mcp:
    image: python:3.11-slim
    container_name: arkham-mcp
    restart: unless-stopped
    working_dir: /opt/arkham-mcp
    command: ["uv", "run", "arkham-mcp"]
    environment:
      - ARKHAM_API_KEY=${ARKHAM_API_KEY}
      - ARKHAM_BASE_URL=https://api.arkm.com
      - ARKHAM_PROVIDER=arkham
    volumes:
      - ./mcp-servers/arkham:/opt/arkham-mcp
    ports:
      - "8088:8080"
    networks:
      - aria-net

  # ------------------------------------------------------------------
  # Notte MCP (фреймворк для сложной веб-разведки)
  # ------------------------------------------------------------------
  notte-mcp:
    image: python:3.11-slim
    container_name: notte-mcp
    restart: unless-stopped
    command: ["uvx", "notte-mcp"]
    environment:
      - NOTTE_API_KEY=${NOTTE_API_KEY}
    ports:
      - "8089:8080"
    networks:
      - aria-net

  # ------------------------------------------------------------------
  # CoRT MCP (мета-когнитивный движок)
  # ------------------------------------------------------------------
  cort-mcp:
    image: python:3.11-slim
    container_name: cort-mcp
    restart: unless-stopped
    command: ["pipx", "run", "cort-mcp", "--log=off"]
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    networks:
      - aria-net

  # ------------------------------------------------------------------
  # Perplexity MCP (оперативный поиск с цитированием)
  # ------------------------------------------------------------------
  perplexity-mcp:
    image: python:3.11-slim
    container_name: perplexity-mcp
    restart: unless-stopped
    command: ["uvx", "perplexity-mcp"]
    environment:
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - PERPLEXITY_MODEL=sonar-pro
    ports:
      - "8090:8080"
    networks:
      - aria-net

  # ------------------------------------------------------------------
  # DBHub (универсальный SQL-шлюз, 5 СУБД)
  # ------------------------------------------------------------------
  dbhub:
    image: node:18-alpine
    container_name: dbhub
    restart: unless-stopped
    command: ["npx", "@bytebase/dbhub@latest", "--dsn", "file:///var/lib/aria/dbhub.toml"]
    volumes:
      - ./mcp-servers/dbhub:/var/lib/aria
    ports:
      - "8091:8080"
    networks:
      - aria-net

  # ------------------------------------------------------------------
  # Postgres MCP (глубокое администрирование PostgreSQL)
  # ------------------------------------------------------------------
  postgres-mcp:
    image: node:18-alpine
    container_name: postgres-mcp
    restart: unless-stopped
    command: ["npx", "@crystaldba/postgres-mcp"]
    environment:
      - DATABASE_URL=${POSTGRES_URL}
    ports:
      - "8092:8080"
    networks:
      - aria-net

  # ------------------------------------------------------------------
  # MetaMCP (клиентский диспетчер и унификатор MCP-подключений)
  # ------------------------------------------------------------------
  metamcp:
    image: node:18-alpine
    container_name: metamcp
    restart: unless-stopped
    command: ["npx", "metamcp"]
    ports:
      - "8093:8080"
    networks:
      - aria-net

  # ------------------------------------------------------------------
  # ACO Prompt Shield (активный фильтр безопасности MCP)
  # Располагается перед mcp-proxy, санирует и валидирует трафик
  # ------------------------------------------------------------------
  aco-prompt-shield:
    image: python:3.11-slim
    container_name: aco-prompt-shield
    restart: unless-stopped
    command: ["uvx", "aco-prompt-shield"]
    environment:
      - SHIELD_MODE=strict
      - SHIELD_SCAN_PII=true
      - SHIELD_SCAN_INJECTION=true
    ports:
      - "8100:8080"
    networks:
      - aria-net

  # ------------------------------------------------------------------
  # mcp-proxy (пограничный шлюз безопасности)
  # Теперь поддерживает STRICT_MODE, валидацию схем, белый список инструментов
  # и интеграцию с ACO Prompt Shield
  # ------------------------------------------------------------------
  mcp-proxy:
    image: node:18-alpine
    container_name: mcp-proxy
    restart: unless-stopped
    command: ["npx", "@sparfenyuk/mcp-proxy"]
    environment:
      - MCP_PROXY_AUTH=oauth2
      - MCP_PROXY_RATE_LIMIT=100
      # Новые параметры безопасности, добавленные в v13.01
      - MCP_PROXY_STRICT_MODE=true
      - MCP_PROXY_SCHEMA_VALIDATION=true
      - MCP_PROXY_TOOL_ALLOW_LIST=${MCP_ALLOW_LIST}
      - MCP_PROXY_UPSTREAM_SHIELD=aco-prompt-shield:8080
    ports:
      - "8094:8080"
    networks:
      - aria-net
    depends_on:
      - aco-prompt-shield

  # ------------------------------------------------------------------
  # CacheRact (Red Team инструмент для тестирования безопасности KV-кэша)
  # По умолчанию отключён; включается только во время активного аудита
  # ------------------------------------------------------------------
  cacheract:
    image: python:3.11-slim
    container_name: cacheract
    profiles: ["redteam"]
    restart: "no"
    command: ["uvx", "cacheract"]
    environment:
      - CACHERACT_MODE=audit
    networks:
      - aria-net

# ============================================================
# Тома для персистентности данных
# ============================================================
volumes:
  core_config:
  core_data:
  memory_data:
  sentinel_data:
  interface_config:
  ollama_models:
  greptime_data:
  # lancedb_data:
  shared_models:

# ============================================================
# Виртуальная сеть ARIA
# ============================================================
networks:
  aria-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
